<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Визуализация ошибок</title>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/min/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment/locale/ru.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", function () {
        Telegram.WebApp.ready();

        const isTelegram = !!Telegram?.WebApp?.initDataUnsafe?.user;

        // Если это Telegram WebApp — подгружаем разрешённые ID
        if (isTelegram) {
          fetch("telegram_subscribers.txt")
            .then((response) => {
              if (!response.ok)
                throw new Error(
                  "Не удалось загрузить список разрешённых пользователей"
                );
              return response.text();
            })
            .then((text) => {
              const allowedUserIds = text
                .split("\n")
                .map((id) => id.trim())
                .filter((id) => id !== "");

              const userId =
                Telegram.WebApp.initDataUnsafe.user?.id?.toString();

              if (!allowedUserIds.includes(userId)) {
                document.body.innerHTML = `<h2 style="text-align:center; margin-top:50px;">Подпишитесь на бота, чтобы получить доступ</h2>`;
              }

              console.log("✅ Пользователь разрешён:", userId);
            })
            .catch((err) => {
              console.error("Ошибка при проверке доступа:", err);
              document.body.innerHTML = `<h2 style="text-align:center; margin-top:50px;">Подпишитесь на бота, чтобы получить доступ</h2>`;
            });
        } else {
          console.log("⚠️ Не Telegram WebApp — прямой доступ разрешён");
        }
      });
    </script>
    <div class="container">
      <h1>Визуализация ошибок</h1>
      <div id="errorMessage"></div>

      <div class="select-container">
        <!-- Тип данных -->
        <select id="dataType" onchange="onParamsChange(true)">
          <option value="main">Основные домены</option>
          <option value="clone">Домены клонов</option>
        </select>

        <!-- Тип ошибки -->
        <select id="errorType" onchange="onParamsChange()">
          <option value="all">Все ошибки</option>
          <option value="медленный ответ">Медленный ответ</option>
          <option value="не дождался ответа">Не дождался ответа</option>
          <option value="недоступен">Недоступен</option>
        </select>

        <!-- Домены -->
        <select id="targetSelect" onchange="onParamsChange()"></select>

        <!-- Зоны -->
        <select id="zoneSelect" onchange="onParamsChange()"></select>

        <!-- Диапазон дат -->
        <div class="date-range">
          <input type="date" id="startDate" onchange="onParamsChange()" />
          <input type="date" id="endDate" onchange="onParamsChange()" />
        </div>

        <!-- Группировка -->
        <select id="groupBy" onchange="onParamsChange()">
          <option value="month">По месяцам</option>
          <option value="week">По неделям</option>
          <option value="day">По дням</option>
        </select>
      </div>

      <div class="chart-wrapper">
        <div id="loader" class="loader">Загрузка...</div>
        <canvas id="errorChart"></canvas>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
