<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Визуализация ошибок</title>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/min/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Визуализация ошибок</h1>
      <div id="errorMessage"></div>
      <div class="select-container">
        <label for="dataType">Тип данных:</label>
        <select id="dataType" onchange="loadData()">
          <option value="main">Основные домены</option>
          <option value="clone">Домены клонов</option>
        </select>

        <label for="errorType">Все ошибки:</label>
        <select id="errorType" onchange="updateChart()">
          <option value="all">Все ошибки</option>
          <option value="медленный ответ">Медленный ответ</option>
          <option value="не дождался ответа">Не дождался ответа</option>
          <option value="недоступен">Недоступен</option>
        </select>

        <label for="targetSelect">Все домены:</label>
        <select id="targetSelect" onchange="updateChart()"></select>

        <label for="zoneSelect">Все зоны:</label>
        <select id="zoneSelect" onchange="updateChart()"></select>

        <label for="groupBy">По месяцам:</label>
        <select id="groupBy" onchange="updateChart()">
          <option value="month">По месяцам</option>
          <option value="week">По неделям</option>
          <option value="day">По дням</option>
        </select>
      </div>

      <div class="chart-wrapper">
        <canvas id="errorChart"></canvas>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
